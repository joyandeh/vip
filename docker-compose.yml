services:
  redis:
    image: redis:7-alpine
    container_name: vip_redis

    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    build: .
    container_name: vip_web
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/1
      - DEBUG=0
    volumes:
      - ./media:/app/media
      - ./static:/app/static
    restart: unless-stopped
    command: gunicorn vip_crypto.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2

volumes:
  redis_data:
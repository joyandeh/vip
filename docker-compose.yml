services:
  redis:
    image: redis:7-alpine
    container_name: vip_redis

    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    build: .
    container_name: vip_web
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/1
      - DEBUG=0
    volumes:
      - ./media:/app/media
      - ./static:/app/static
    restart: unless-stopped
    command: gunicorn vip_crypto.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2

  scheduler:
    build: .
    container_name: vip_scheduler
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/1
      - DEBUG=0
    volumes:
      - ./media:/app/media
      - ./static:/app/static
    command: >
      sh -c "
        echo '*/5 * * * * root cd /app && REDIS_URL=redis://redis:6379/1 /usr/local/bin/python manage.py update_rates >> /var/log/cron.log 2>&1' > /etc/cron.d/update_rates &&
        chmod 0644 /etc/cron.d/update_rates &&
        crontab /etc/cron.d/update_rates &&
        touch /var/log/cron.log &&
        cron -f
      "
    restart: unless-stopped

volumes:
  redis_data:
